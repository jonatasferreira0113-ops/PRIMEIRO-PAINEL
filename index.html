<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Calculadora</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* ============================
           CALCULADORA
        ============================ */

        #calculadora {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            background: #000;

            padding-top: 50px;
            padding-left: 12px;
            padding-right: 12px;
            padding-bottom: 12px;

            display: flex;
            flex-direction: column;
        }


        /* ============================
           DISPLAY
        ============================ */

        #display {

            width: 100%;

            height: 35%;

            display: flex;

            align-items: flex-end;
            justify-content: flex-end;

            padding: 0 12px 15px;

            color: white;

            font-size: 80px;

            font-weight: 300;

            line-height: 1;

            overflow: hidden;

            white-space: nowrap;
        }


        /* ============================
           BOTÕES
        ============================ */

        .botoes {

            width: 100%;

            height: 65%;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            grid-template-rows:
                repeat(5, 1fr);

            gap: 10px;
        }


        button {

            border: none;

            outline: none;

            font-family: Arial, Helvetica, sans-serif;

            cursor: pointer;

            -webkit-user-select: none;
            user-select: none;
        }


        .botao {

            width: 100%;
            height: 100%;

            border-radius: 50%;

            background: #333333;

            color: white;

            font-size: 32px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .botao:active {

            opacity: 0.5;
        }


        .especial {

            background: #a5a5a5;

            color: #000;
        }


        .operador {

            background: #ff9f0a;

            color: #fff;
        }


        .zero {

            grid-column: span 2;

            border-radius: 100px;

            justify-content: flex-start;

            padding-left: 28px;
        }



        /* ============================
           PAINEL
        ============================ */

        #painel {

            display: none;

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            background: #080808;

            color: white;

            padding:
                60px
                20px
                30px
                20px;

            overflow-y: auto;
        }


        .painel-container {

            width: 100%;

            max-width: 600px;

            margin: 0 auto;
        }


        .painel-titulo {

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .painel-subtitulo {

            color: #999;

            margin-bottom: 25px;
        }


        .card {

            background: #151515;

            border: 1px solid #292929;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 15px;
        }


        .card h2 {

            margin-bottom: 8px;

            font-size: 20px;
        }


        .card p {

            color: #aaa;

            line-height: 1.5;
        }


        .painel-botao {

            width: 100%;

            height: 55px;

            margin-top: 15px;

            border-radius: 14px;

            background: #007aff;

            color: white;

            font-size: 18px;

            font-weight: 600;
        }


        .voltar {

            background: #222;
        }



        /* ============================
           CELULARES PEQUENOS
        ============================ */

        @media (max-height: 700px) {

            #calculadora {

                padding-top: 35px;
            }

            #display {

                height: 28%;

                font-size: 65px;
            }

            .botoes {

                height: 72%;

                gap: 7px;
            }

            .botao {

                font-size: 27px;
            }
        }


        /* ============================
           IPHONE MAIS ESTREITO
        ============================ */

        @media (max-width: 380px) {

            #calculadora {

                padding-left: 8px;
                padding-right: 8px;
            }

            .botoes {

                gap: 8px;
            }

            .botao {

                font-size: 28px;
            }

            .zero {

                padding-left: 24px;
            }
        }

    </style>

</head>


<body>


    <!-- ============================
         CALCULADORA
    ============================ -->

    <div id="calculadora">


        <div id="display">
            0
        </div>


        <div class="botoes">


            <!-- 1ª LINHA -->

            <button
                class="botao especial"
                onclick="limpar()"
            >
                AC
            </button>


            <button
                class="botao especial"
                onclick="porcentagem()"
            >
                %
            </button>


            <button
                class="botao especial"
                onclick="sinal()"
            >
                ±
            </button>


            <button
                class="botao operador"
                onclick="operador('/')"
            >
                ÷
            </button>



            <!-- 2ª LINHA -->

            <button
                class="botao"
                onclick="numero('7')"
            >
                7
            </button>


            <button
                class="botao"
                onclick="numero('8')"
            >
                8
            </button>


            <button
                class="botao"
                onclick="numero('9')"
            >
                9
            </button>


            <button
                class="botao operador"
                onclick="operador('*')"
            >
                ×
            </button>



            <!-- 3ª LINHA -->

            <button
                class="botao"
                onclick="numero('4')"
            >
                4
            </button>


            <button
                class="botao"
                onclick="numero('5')"
            >
                5
            </button>


            <button
                class="botao"
                onclick="numero('6')"
            >
                6
            </button>


            <button
                class="botao operador"
                onclick="operador('-')"
            >
                −
            </button>



            <!-- 4ª LINHA -->

            <button
                class="botao"
                onclick="numero('1')"
            >
                1
            </button>


            <button
                class="botao"
                onclick="numero('2')"
            >
                2
            </button>


            <button
                class="botao"
                onclick="numero('3')"
            >
                3
            </button>


            <button
                class="botao operador"
                onclick="operador('+')"
            >
                +
            </button>



            <!-- 5ª LINHA -->

            <button
                class="botao zero"
                onclick="numero('0')"
            >
                0
            </button>


            <button
                class="botao"
                onclick="numero('.')"
            >
                .
            </button>


            <button
                class="botao operador"
                onclick="calcular()"
            >
                =
            </button>


        </div>

    </div>



    <!-- ============================
         PAINEL
    ============================ -->

    <div id="painel">


        <div class="painel-container">


            <div class="painel-titulo">
                Meu Primeiro Painel
            </div>


            <div class="painel-subtitulo">
                Painel remoto
            </div>


            <div class="card">

                <h2>
                    Status
                </h2>

                <p id="status">
                    Painel conectado.
                </p>

            </div>


            <div class="card">

                <h2>
                    Controle
                </h2>

                <p>
                    Essa tela pode ser alterada remotamente pelo GitHub.
                </p>


                <button
                    class="painel-botao"
                    onclick="pressionar()"
                >
                    Clique aqui
                </button>


                <button
                    class="painel-botao voltar"
                    onclick="voltar()"
                >
                    Voltar
                </button>

            </div>


        </div>

    </div>



    <script>


        let atual = "0";

        let primeiro = null;

        let op = null;

        let novoNumero = false;

        let zeroAnterior = false;



        function display() {

            document.getElementById(
                "display"
            ).textContent = atual;

        }



        function numero(n) {


            /*
             * DOIS ZEROS ABREM O PAINEL
             */

            if (n === "0") {

                if (zeroAnterior) {

                    abrirPainel();

                    zeroAnterior = false;

                    return;
                }

                zeroAnterior = true;

            } else {

                zeroAnterior = false;

            }



            if (novoNumero) {

                atual =
                    n === "."
                    ? "0."
                    : n;

                novoNumero = false;

            }

            else if (atual === "0") {

                atual =
                    n === "."
                    ? "0."
                    : n;

            }

            else if (
                n === "." &&
                atual.includes(".")
            ) {

                return;

            }

            else {

                atual += n;

            }


            display();

        }



        function limpar() {

            atual = "0";

            primeiro = null;

            op = null;

            novoNumero = false;

            zeroAnterior = false;

            display();

        }



        function porcentagem() {

            atual =
                String(
                    parseFloat(atual) / 100
                );

            display();

        }



        function sinal() {

            if (atual !== "0") {

                atual =
                    String(
                        parseFloat(atual) * -1
                    );

                display();

            }

        }



        function operador(o) {

            primeiro =
                parseFloat(atual);

            op = o;

            novoNumero = true;

            zeroAnterior = false;

        }



        function calcular() {

            if (
                primeiro === null ||
                op === null
            ) {

                return;

            }


            let segundo =
                parseFloat(atual);

            let resultado;


            if (op === "+") {

                resultado =
                    primeiro + segundo;

            }


            else if (op === "-") {

                resultado =
                    primeiro - segundo;

            }


            else if (op === "*") {

                resultado =
                    primeiro * segundo;

            }


            else if (op === "/") {

                if (segundo === 0) {

                    atual = "Erro";

                    display();

                    primeiro = null;

                    op = null;

                    return;

                }

                resultado =
                    primeiro / segundo;

            }


            atual =
                String(
                    Number(
                        resultado.toFixed(8)
                    )
                );


            primeiro = null;

            op = null;

            novoNumero = true;

            display();

        }



        function abrirPainel() {

            document.getElementById(
                "calculadora"
            ).style.display = "none";


            document.getElementById(
                "painel"
            ).style.display = "block";

        }



        function voltar() {

            document.getElementById(
                "painel"
            ).style.display = "none";


            document.getElementById(
                "calculadora"
            ).style.display = "flex";


            limpar();

        }



        function pressionar() {

            document.getElementById(
                "status"
            ).textContent =
                "Botão pressionado!";

        }


    </script>

</body>

</html>
