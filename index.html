<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover">

    <title>Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* =========================
           CALCULADORA
        ========================= */

        #calculadora {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;
            height: 100dvh;

            background: #000;

            display: flex;
            flex-direction: column;

            padding-top: env(safe-area-inset-top);
            padding-left: 12px;
            padding-right: 12px;
            padding-bottom: env(safe-area-inset-bottom);

            overflow: hidden;
        }

        #display {
            flex: 0 0 30%;

            width: 100%;

            display: flex;
            align-items: flex-end;
            justify-content: flex-end;

            padding: 0 10px 15px;

            color: white;

            font-size: clamp(50px, 14vw, 100px);
            font-weight: 300;

            overflow: hidden;
            white-space: nowrap;
        }

        .botoes {
            flex: 1;

            width: 100%;

            display: grid;

            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, minmax(0, 1fr));

            gap: 10px;

            padding-bottom: 8px;
        }

        button {
            border: none;
            outline: none;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            font-size: clamp(22px, 7vw, 32px);

            color: white;
            background: #333;

            display: flex;
            align-items: center;
            justify-content: center;

            touch-action: manipulation;
        }

        button:active {
            filter: brightness(1.5);
        }

        .cinza {
            background: #a5a5a5;
            color: #000;
        }

        .operador {
            background: #ff9500;
            color: white;
        }

        .zero {
            grid-column: span 2;
            border-radius: 999px;

            justify-content: flex-start;

            padding-left: 28px;
        }

        /* =========================
           PAINEL
        ========================= */

        #painel {
            display: none;

            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;
            height: 100dvh;

            background: #111;

            color: white;

            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);

            overflow: auto;
        }

        .painel-conteudo {
            width: 100%;
            min-height: 100%;

            padding: 25px;
        }

        #painel h1 {
            margin-top: 10px;
        }

        #painel button {
            width: 100%;
            height: 60px;

            border-radius: 15px;

            margin-top: 20px;
        }

        /* =========================
           TELAS MENORES
        ========================= */

        @media (max-height: 700px) {

            #display {
                flex-basis: 27%;
                padding-bottom: 8px;
            }

            .botoes {
                gap: 7px;
            }
        }

        /* =========================
           TELAS GRANDES
        ========================= */

        @media (min-height: 800px) {

            #display {
                flex-basis: 32%;
            }

            .botoes {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         CALCULADORA
    ========================= -->

    <div id="calculadora">

        <div id="display">0</div>

        <div class="botoes">

            <button class="cinza" onclick="limpar()">
                AC
            </button>

            <button class="cinza" onclick="porcentagem()">
                %
            </button>

            <button class="cinza" onclick="sinal()">
                ±
            </button>

            <button class="operador" onclick="operador('/')">
                ÷
            </button>


            <button onclick="numero('7')">
                7
            </button>

            <button onclick="numero('8')">
                8
            </button>

            <button onclick="numero('9')">
                9
            </button>

            <button class="operador" onclick="operador('*')">
                ×
            </button>


            <button onclick="numero('4')">
                4
            </button>

            <button onclick="numero('5')">
                5
            </button>

            <button onclick="numero('6')">
                6
            </button>

            <button class="operador" onclick="operador('-')">
                −
            </button>


            <button onclick="numero('1')">
                1
            </button>

            <button onclick="numero('2')">
                2
            </button>

            <button onclick="numero('3')">
                3
            </button>

            <button class="operador" onclick="operador('+')">
                +
            </button>


            <!-- BOTÃO 00 -->
            <button class="zero" onclick="abrirPainel()">
                00
            </button>

            <button onclick="numero('.')">
                .
            </button>

            <button class="operador" onclick="calcular()">
                =
            </button>

        </div>

    </div>


    <!-- =========================
         PAINEL
    ========================= -->

    <div id="painel">

        <div class="painel-conteudo">

            <h1>Meu Primeiro Painel</h1>

            <p>Painel online</p>

            <button onclick="voltar()">
                Voltar
            </button>

        </div>

    </div>


    <script>

        let valorAtual = "0";
        let valorAnterior = null;
        let operadorAtual = null;


        /* =========================
           DISPLAY
        ========================= */

        function atualizarDisplay() {

            document.getElementById("display").textContent =
                valorAtual;

        }


        /* =========================
           NÚMEROS
        ========================= */

        function numero(n) {

            if (
                n === "." &&
                valorAtual.includes(".")
            ) {
                return;
            }

            if (
                valorAtual === "0" &&
                n !== "."
            ) {

                valorAtual = n;

            } else {

                valorAtual += n;

            }

            atualizarDisplay();
        }


        /* =========================
           LIMPAR
        ========================= */

        function limpar() {

            valorAtual = "0";
            valorAnterior = null;
            operadorAtual = null;

            atualizarDisplay();
        }


        /* =========================
           PORCENTAGEM
        ========================= */

        function porcentagem() {

            valorAtual =
                String(parseFloat(valorAtual) / 100);

            atualizarDisplay();
        }


        /* =========================
           SINAL
        ========================= */

        function sinal() {

            if (valorAtual !== "0") {

                valorAtual =
                    String(parseFloat(valorAtual) * -1);

            }

            atualizarDisplay();
        }


        /* =========================
           OPERADOR
        ========================= */

        function operador(op) {

            valorAnterior =
                parseFloat(valorAtual);

            operadorAtual = op;

            valorAtual = "0";

            atualizarDisplay();
        }


        /* =========================
           CALCULAR
        ========================= */

        function calcular() {

            if (
                valorAnterior === null ||
                operadorAtual === null
            ) {
                return;
            }

            let atual =
                parseFloat(valorAtual);

            let resultado;

            switch (operadorAtual) {

                case "+":
                    resultado =
                        valorAnterior + atual;
                    break;

                case "-":
                    resultado =
                        valorAnterior - atual;
                    break;

                case "*":
                    resultado =
                        valorAnterior * atual;
                    break;

                case "/":
                    resultado =
                        atual === 0
                            ? 0
                            : valorAnterior / atual;
                    break;
            }

            valorAtual =
                String(resultado);

            valorAnterior = null;
            operadorAtual = null;

            atualizarDisplay();
        }


        /* =========================
           ABRIR PAINEL
        ========================= */

        function abrirPainel() {

            document.getElementById("calculadora")
                .style.display = "none";

            document.getElementById("painel")
                .style.display = "block";
        }


        /* =========================
           VOLTAR
        ========================= */

        function voltar() {

            document.getElementById("painel")
                .style.display = "none";

            document.getElementById("calculadora")
                .style.display = "flex";

            limpar();
        }

    </script>

</body>

</html>
