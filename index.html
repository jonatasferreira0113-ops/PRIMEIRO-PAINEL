<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Calculadora</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   CALCULADORA
========================= */

.calculadora {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    padding: 20px 14px 14px;
}

.display {
    height: 28vh;
    min-height: 180px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0 18px 20px;
    color: white;
    font-size: clamp(70px, 15vw, 120px);
    font-weight: 300;
    overflow: hidden;
}

.teclas {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
}

.tecla {
    border: none;
    border-radius: 50%;
    color: white;
    background: #303030;
    font-size: clamp(28px, 7vw, 48px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}

.tecla:active {
    filter: brightness(1.5);
}

.tecla.clara {
    background: #636363;
    color: white;
}

.tecla.laranja {
    background: #ff9500;
    color: white;
}

.zero {
    grid-column: 2;
}

.maismenos {
    font-size: clamp(24px, 6vw, 40px);
}

/* =========================
   PAINEL
========================= */

.painel {
    display: none;
    width: 100%;
    height: 100%;
    background: #0b0b0f;
}

.painel iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.voltar {
    position: fixed;
    z-index: 10;
    top: 15px;
    left: 15px;

    border: 0;
    border-radius: 12px;

    padding: 10px 15px;

    background: rgba(0,0,0,.7);
    color: white;

    font-size: 15px;
}
</style>
</head>

<body>

<!-- =========================
     TELA DA CALCULADORA
========================= -->

<div class="calculadora" id="calculadora">

    <div class="display" id="display">
        0
    </div>

    <div class="teclas">

        <button class="tecla clara" onclick="limpar()">⌫</button>
        <button class="tecla clara" onclick="limparTudo()">AC</button>
        <button class="tecla clara" onclick="porcentagem()">%</button>
        <button class="tecla laranja" onclick="operacao('÷')">÷</button>

        <button class="tecla" onclick="numero(7)">7</button>
        <button class="tecla" onclick="numero(8)">8</button>
        <button class="tecla" onclick="numero(9)">9</button>
        <button class="tecla laranja" onclick="operacao('×')">×</button>

        <button class="tecla" onclick="numero(4)">4</button>
        <button class="tecla" onclick="numero(5)">5</button>
        <button class="tecla" onclick="numero(6)">6</button>
        <button class="tecla laranja" onclick="operacao('-')">−</button>

        <button class="tecla" onclick="numero(1)">1</button>
        <button class="tecla" onclick="numero(2)">2</button>
        <button class="tecla" onclick="numero(3)">3</button>
        <button class="tecla laranja" onclick="operacao('+')">+</button>

        <button class="tecla maismenos" onclick="trocarSinal()">+/−</button>
        <button class="tecla zero" onclick="zero()">0</button>
        <button class="tecla" onclick="numero(',')">,</button>
        <button class="tecla laranja" onclick="resultado()">=</button>

    </div>

</div>


<!-- =========================
     PAINEL REMOTO
========================= -->

<div class="painel" id="painel">

    <button class="voltar" onclick="voltar()">
        ← Voltar
    </button>

    <iframe
        src="https://jonatasferreira0113-ops.github.io/PRIMEIRO-PAINEL/">
    </iframe>

</div>


<script>

let valor = "0";
let ultimoZero = false;

const display = document.getElementById("display");


function atualizar() {
    display.innerText = valor;
}


/* NÚMEROS */

function numero(n) {

    if (valor === "0") {
        valor = String(n);
    } else {
        valor += String(n);
    }

    ultimoZero = false;

    atualizar();
}


/* ZERO */

function zero() {

    /*
       Se o usuário apertar 0 duas vezes
       seguidas, abre o painel.
    */

    if (ultimoZero) {
        abrirPainel();
        return;
    }

    if (valor === "0") {
        valor = "0";
    } else {
        valor += "0";
    }

    ultimoZero = true;

    atualizar();
}


/* ABRIR PAINEL */

function abrirPainel() {

    document.getElementById("calculadora").style.display = "none";

    document.getElementById("painel").style.display = "block";

}


/* VOLTAR */

function voltar() {

    document.getElementById("painel").style.display = "none";

    document.getElementById("calculadora").style.display = "flex";

    valor = "0";
    ultimoZero = false;

    atualizar();
}


/* LIMPAR */

function limpar() {

    valor = valor.slice(0, -1);

    if (valor === "") {
        valor = "0";
    }

    ultimoZero = false;

    atualizar();
}


function limparTudo() {

    valor = "0";
    ultimoZero = false;

    atualizar();
}


/* OPERAÇÕES */

function operacao(op) {

    valor += " " + op + " ";

    ultimoZero = false;

    atualizar();
}


function porcentagem() {

    let n = parseFloat(valor);

    if (!isNaN(n)) {
        valor = String(n / 100);
    }

    atualizar();
}


function trocarSinal() {

    let n = parseFloat(valor);

    if (!isNaN(n)) {
        valor = String(n * -1);
    }

    atualizar();
}


function resultado() {

    try {

        let expressao = valor
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/−/g, "-")
            .replace(/,/g, ".");

        /*
          Calculadora simples.
        */

        if (/^[0-9+\-*/. ()]+$/.test(expressao)) {
            valor = String(eval(expressao));
        }

    } catch {

        valor = "Erro";

    }

    ultimoZero = false;

    atualizar();
}

</script>

</body>
</html>
