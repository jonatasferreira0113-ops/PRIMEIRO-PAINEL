<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">

    <title>Calculadora</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;
            color: white;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        button {
            border: none;
            outline: none;

            font-family: inherit;

            user-select: none;
            -webkit-user-select: none;

            cursor: pointer;
        }


        /* =====================================
           CALCULADORA
        ===================================== */

        #calculadora {

            width: 100%;
            height: 100dvh;

            min-height: 0;

            display: flex;
            flex-direction: column;

            background: #000;

            padding-top: env(safe-area-inset-top);
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: env(safe-area-inset-bottom);
        }


        /* =====================================
           DISPLAY
        ===================================== */

        #display {

            width: 100%;

            flex: 0 0 25%;

            min-height: 0;

            display: flex;

            align-items: flex-end;
            justify-content: flex-end;

            padding: 0 10px 12px;

            color: white;

            font-size: clamp(55px, 17vw, 82px);

            font-weight: 300;

            line-height: 1;

            overflow: hidden;

            white-space: nowrap;

            text-align: right;
        }


        /* =====================================
           ÁREA DOS BOTÕES
        ===================================== */

        .botoes {

            width: 100%;

            flex: 1 1 auto;

            min-height: 0;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            grid-template-rows:
                repeat(5, minmax(0, 1fr));

            gap: 10px;

            padding-bottom: 10px;
        }


        /* =====================================
           BOTÕES
        ===================================== */

        .botao {

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            border-radius: 50%;

            background: #333333;

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: clamp(22px, 7vw, 32px);

            font-weight: 400;

            padding: 0;
        }

        .botao:active {
            opacity: 0.55;
        }


        /* =====================================
           BOTÕES ESPECIAIS
        ===================================== */

        .especial {

            background: #a5a5a5;

            color: #000;
        }


        /* =====================================
           OPERADORES
        ===================================== */

        .operador {

            background: #ff9f0a;

            color: white;
        }


        /* =====================================
           ZERO
        ===================================== */

        .zero {

            grid-column: span 2;

            border-radius: 999px;

            justify-content: flex-start;

            padding-left: 25px;
        }


        /* =====================================
           PAINEL
        ===================================== */

        #painel {

            display: none;

            width: 100%;
            height: 100dvh;

            min-height: 0;

            background: #080808;

            padding-top:
                calc(
                    env(safe-area-inset-top) + 20px
                );

            padding-left: 20px;
            padding-right: 20px;

            padding-bottom:
                calc(
                    env(safe-area-inset-bottom) + 20px
                );

            overflow-y: auto;
        }


        .painel-container {

            width: 100%;

            max-width: 600px;

            margin: 0 auto;
        }


        .painel-titulo {

            margin-top: 10px;

            margin-bottom: 8px;

            font-size: 32px;

            font-weight: 700;
        }


        .painel-subtitulo {

            margin-bottom: 25px;

            color: #999;

            font-size: 16px;
        }


        .card {

            width: 100%;

            margin-bottom: 15px;

            padding: 20px;

            background: #151515;

            border: 1px solid #292929;

            border-radius: 18px;
        }


        .card h2 {

            margin: 0 0 8px;

            font-size: 20px;
        }


        .card p {

            margin: 0;

            color: #aaa;

            font-size: 15px;

            line-height: 1.5;
        }


        .painel-botao {

            width: 100%;

            height: 55px;

            margin-top: 15px;

            border-radius: 14px;

            background: #007aff;

            color: white;

            font-size: 18px;

            font-weight: 600;
        }


        .painel-botao:active {

            opacity: 0.7;
        }


        .voltar {

            margin-top: 10px;

            background: #222;
        }


        /* =====================================
           TELAS MUITO PEQUENAS
        ===================================== */

        @media (max-height: 650px) {

            #display {
                flex-basis: 20%;
            }

            .botoes {
                gap: 7px;
                padding-bottom: 5px;
            }

        }


        /* =====================================
           IPHONE / CELULAR MAIS ESTREITO
        ===================================== */

        @media (max-width: 360px) {

            #calculadora {

                padding-left: 10px;
                padding-right: 10px;
            }

            .botoes {

                gap: 7px;
            }

            .zero {

                padding-left: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         CALCULADORA
    ===================================== -->

    <div id="calculadora">

        <div id="display">
            0
        </div>


        <div class="botoes">


            <!-- LINHA 1 -->

            <button
                type="button"
                class="botao especial"
                onclick="limpar()"
            >
                AC
            </button>


            <button
                type="button"
                class="botao especial"
                onclick="porcentagem()"
            >
                %
            </button>


            <button
                type="button"
                class="botao especial"
                onclick="mudarSinal()"
            >
                ±
            </button>


            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('/')"
            >
                ÷
            </button>



            <!-- LINHA 2 -->

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('7')"
            >
                7
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('8')"
            >
                8
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('9')"
            >
                9
            </button>


            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('*')"
            >
                ×
            </button>



            <!-- LINHA 3 -->

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('4')"
            >
                4
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('5')"
            >
                5
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('6')"
            >
                6
            </button>


            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('-')"
            >
                −
            </button>



            <!-- LINHA 4 -->

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('1')"
            >
                1
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('2')"
            >
                2
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('3')"
            >
                3
            </button>


            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('+')"
            >
                +
            </button>



            <!-- LINHA 5 -->

            <button
                type="button"
                class="botao zero"
                onclick="digitarNumero('0')"
            >
                0
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('.')"
            >
                .
            </button>


            <button
                type="button"
                class="botao operador"
                onclick="calcular()"
            >
                =
            </button>


        </div>

    </div>



    <!-- =====================================
         PAINEL
    ===================================== -->

    <div id="painel">

        <div class="painel-container">


            <div class="painel-titulo">
                Meu Primeiro Painel
            </div>


            <div class="painel-subtitulo">
                Painel remoto
            </div>


            <div class="card">

                <h2>
                    Status
                </h2>

                <p id="status">
                    Painel conectado.
                </p>

            </div>


            <div class="card">

                <h2>
                    Controle
                </h2>

                <p>
                    Essa tela pode ser alterada remotamente pelo GitHub.
                </p>


                <button
                    type="button"
                    class="painel-botao"
                    onclick="pressionar()"
                >
                    Clique aqui
                </button>


                <button
                    type="button"
                    class="painel-botao voltar"
                    onclick="voltar()"
                >
                    Voltar
                </button>

            </div>


        </div>

    </div>



    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script>

        let valorAtual = "0";

        let primeiroValor = null;

        let operadorAtual = null;

        let esperandoSegundoValor = false;

        let primeiroZero = false;



        function atualizarDisplay() {

            document.getElementById(
                "display"
            ).textContent = valorAtual;

        }



        function digitarNumero(numero) {


            /*

                DOIS TOQUES NO ZERO
                ABREM O PAINEL

            */

            if (numero === "0") {

                if (primeiroZero) {

                    abrirPainel();

                    primeiroZero = false;

                    return;
                }

                primeiroZero = true;

            } else {

                primeiroZero = false;

            }



            if (esperandoSegundoValor) {

                if (numero === ".") {

                    valorAtual = "0.";

                } else {

                    valorAtual = numero;

                }

                esperandoSegundoValor = false;

            }


            else if (valorAtual === "0") {

                if (numero === ".") {

                    valorAtual = "0.";

                } else {

                    valorAtual = numero;

                }

            }


            else if (
                numero === "." &&
                valorAtual.includes(".")
            ) {

                return;

            }


            else {

                valorAtual += numero;

            }


            atualizarDisplay();

        }



        function limpar() {

            valorAtual = "0";

            primeiroValor = null;

            operadorAtual = null;

            esperandoSegundoValor = false;

            primeiroZero = false;

            atualizarDisplay();

        }



        function porcentagem() {

            const numero =
                parseFloat(valorAtual);

            if (isNaN(numero)) {

                valorAtual = "0";

            } else {

                valorAtual =
                    String(numero / 100);

            }

            atualizarDisplay();

        }



        function mudarSinal() {

            const numero =
                parseFloat(valorAtual);

            if (
                isNaN(numero) ||
                numero === 0
            ) {

                return;

            }

            valorAtual =
                String(numero * -1);

            atualizarDisplay();

        }



        function selecionarOperador(operador) {

            const numero =
                parseFloat(valorAtual);

            if (isNaN(numero)) {

                return;

            }


            primeiroValor = numero;

            operadorAtual = operador;

            esperandoSegundoValor = true;

            primeiroZero = false;

        }



        function calcular() {

            if (
                primeiroValor === null ||
                operadorAtual === null
            ) {

                return;

            }


            const segundoValor =
                parseFloat(valorAtual);


            if (isNaN(segundoValor)) {

                return;

            }


            let resultado;


            switch (operadorAtual) {


                case "+":

                    resultado =
                        primeiroValor +
                        segundoValor;

                    break;


                case "-":

                    resultado =
                        primeiroValor -
                        segundoValor;

                    break;


                case "*":

                    resultado =
                        primeiroValor *
                        segundoValor;

                    break;


                case "/":

                    if (segundoValor === 0) {

                        valorAtual = "Erro";

                        primeiroValor = null;

                        operadorAtual = null;

                        esperandoSegundoValor = false;

                        atualizarDisplay();

                        return;

                    }

                    resultado =
                        primeiroValor /
                        segundoValor;

                    break;


                default:

                    return;

            }


            valorAtual =
                String(
                    Number(
                        resultado.toFixed(10)
                    )
                );


            primeiroValor = null;

            operadorAtual = null;

            esperandoSegundoValor = true;

            primeiroZero = false;

            atualizarDisplay();

        }



        /* =====================================
           ABRIR PAINEL
        ===================================== */

        function abrirPainel() {

            document.getElementById(
                "calculadora"
            ).style.display = "none";


            document.getElementById(
                "painel"
            ).style.display = "block";


            document.body.style.overflow =
                "auto";

        }



        /* =====================================
           VOLTAR
        ===================================== */

        function voltar() {

            document.getElementById(
                "painel"
            ).style.display = "none";


            document.getElementById(
                "calculadora"
            ).style.display = "flex";


            document.body.style.overflow =
                "hidden";


            limpar();

        }



        /* =====================================
           BOTÃO DO PAINEL
        ===================================== */

        function pressionar() {

            document.getElementById(
                "status"
            ).textContent =
                "Botão pressionado!";

        }

    </script>

</body>

</html>
