<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* =========================
           CALCULADORA
        ========================= */

        #calculadora {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        #display {
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;

            font-size: 80px;
            font-weight: 300;
            color: white;

            padding: 0 10px 15px;
            overflow: hidden;
            white-space: nowrap;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: 20px;
        }

        button {
            border: none;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            user-select: none;
        }

        .botao {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;

            background: #333333;
            color: white;

            font-size: 30px;
            font-weight: 400;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .botao:active {
            opacity: 0.6;
        }

        .especial {
            background: #a5a5a5;
            color: black;
        }

        .operador {
            background: #ff9f0a;
            color: white;
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 50px;
            justify-content: flex-start;
            padding-left: 30px;
        }


        /* =========================
           PAINEL
        ========================= */

        #painel {
            display: none;
            min-height: 100vh;
            background: #080808;
            padding: 25px;
        }

        .painel-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .painel-titulo {
            font-size: 32px;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .painel-subtitulo {
            color: #999;
            margin-bottom: 30px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            color: #aaa;
        }

        .painel-botao {
            width: 100%;
            height: 55px;
            border-radius: 14px;
            background: #007aff;
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-top: 15px;
        }

        .painel-botao:active {
            opacity: 0.7;
        }

        .voltar {
            background: #222;
            margin-top: 10px;
        }

        @media (min-width: 600px) {
            #calculadora {
                max-width: 500px;
                margin: auto;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TELA DA CALCULADORA
    ========================= -->

    <div id="calculadora">

        <div id="display">0</div>

        <div class="botoes">

            <button class="botao especial" onclick="limpar()">AC</button>
            <button class="botao especial" onclick="porcentagem()">%</button>
            <button class="botao especial" onclick="operacao('±')">±</button>
            <button class="botao operador" onclick="operacao('/')">÷</button>

            <button class="botao" onclick="numero('7')">7</button>
            <button class="botao" onclick="numero('8')">8</button>
            <button class="botao" onclick="numero('9')">9</button>
            <button class="botao operador" onclick="operacao('*')">×</button>

            <button class="botao" onclick="numero('4')">4</button>
            <button class="botao" onclick="numero('5')">5</button>
            <button class="botao" onclick="numero('6')">6</button>
            <button class="botao operador" onclick="operacao('-')">−</button>

            <button class="botao" onclick="numero('1')">1</button>
            <button class="botao" onclick="numero('2')">2</button>
            <button class="botao" onclick="numero('3')">3</button>
            <button class="botao operador" onclick="operacao('+')">+</button>

            <button class="botao zero" onclick="numero('0')">0</button>
            <button class="botao" onclick="numero('.')">.</button>
            <button class="botao operador" onclick="calcular()">=</button>

        </div>
    </div>


    <!-- =========================
         TELA DO PAINEL
    ========================= -->

    <div id="painel">

        <div class="painel-container">

            <div class="painel-titulo">
                Meu Primeiro Painel
            </div>

            <div class="painel-subtitulo">
                Painel remoto
            </div>

            <div class="card">
                <h2>Status</h2>
                <p id="status">Painel conectado.</p>
            </div>

            <div class="card">
                <h2>Controle</h2>
                <p>Essa tela pode ser alterada remotamente pelo GitHub.</p>

                <button class="painel-botao" onclick="pressionar()">
                    Clique aqui
                </button>

                <button class="painel-botao voltar" onclick="voltar()">
                    Voltar
                </button>
            </div>

        </div>

    </div>


    <script>

        let valorAtual = "0";
        let primeiroValor = null;
        let operadorAtual = null;
        let esperandoSegundoValor = false;

        // Controle para detectar 00
        let primeiroZero = false;


        function atualizarDisplay() {
            document.getElementById("display").textContent = valorAtual;
        }


        function numero(numero) {

            // Detecta 00
            if (numero === "0") {

                if (primeiroZero) {
                    abrirPainel();
                    primeiroZero = false;
                    return;
                }

                primeiroZero = true;

            } else {
                primeiroZero = false;
            }


            if (esperandoSegundoValor) {
                valorAtual = numero;
                esperandoSegundoValor = false;
            }

            else if (valorAtual === "0") {
                valorAtual = numero;
            }

            else {
                valorAtual += numero;
            }

            atualizarDisplay();
        }


        function limpar() {

            valorAtual = "0";
            primeiroValor = null;
            operadorAtual = null;
            esperandoSegundoValor = false;
            primeiroZero = false;

            atualizarDisplay();
        }


        function porcentagem() {

            valorAtual = String(parseFloat(valorAtual) / 100);

            atualizarDisplay();
        }


        function operacao(op) {

            if (op === "±") {

                if (valorAtual !== "0") {
                    valorAtual = String(parseFloat(valorAtual) * -1);
                }

                atualizarDisplay();
                return;
            }


            primeiroValor = parseFloat(valorAtual);
            operadorAtual = op;
            esperandoSegundoValor = true;

            primeiroZero = false;
        }


        function calcular() {

            if (
                primeiroValor === null ||
                operadorAtual === null
            ) {
                return;
            }

            const segundoValor = parseFloat(valorAtual);

            let resultado;


            switch (operadorAtual) {

                case "+":
                    resultado = primeiroValor + segundoValor;
                    break;

                case "-":
                    resultado = primeiroValor - segundoValor;
                    break;

                case "*":
                    resultado = primeiroValor * segundoValor;
                    break;

                case "/":
                    resultado = segundoValor === 0
                        ? 0
                        : primeiroValor / segundoValor;
                    break;

                default:
                    return;
            }


            valorAtual = String(resultado);

            primeiroValor = null;
            operadorAtual = null;
            esperandoSegundoValor = true;

            atualizarDisplay();
        }


        // =========================
        // ABRIR PAINEL
        // =========================

        function abrirPainel() {

            document.getElementById("calculadora").style.display = "none";

            document.getElementById("painel").style.display = "block";

            document.body.style.overflow = "auto";
        }


        // =========================
        // VOLTAR
        // =========================

        function voltar() {

            document.getElementById("painel").style.display = "none";

            document.getElementById("calculadora").style.display = "flex";

            document.body.style.overflow = "hidden";

            limpar();
        }


        // =========================
        // BOTÃO DO PAINEL
        // =========================

        function pressionar() {

            document.getElementById("status").textContent =
                "Botão pressionado!";
        }

    </script>

</body>
</html>
