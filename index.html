<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">

    <title>Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
        }

        button {
            border: 0;
            outline: 0;
            font-family: inherit;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================
           CALCULADORA
        ========================= */

        #calculadora {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            padding: 20px;
            background: #000;
        }

        #display {
            width: 100%;
            height: 150px;

            display: flex;
            align-items: flex-end;
            justify-content: flex-end;

            padding: 0 10px 15px;

            color: #fff;
            font-size: 80px;
            font-weight: 300;

            white-space: nowrap;
            overflow: hidden;

            text-align: right;
        }

        .botoes {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 12px;

            padding-bottom: 20px;
        }

        .botao {
            width: 100%;
            aspect-ratio: 1 / 1;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #333;
            color: #fff;

            font-size: 30px;
            font-weight: 400;

            transition: opacity 0.1s;
        }

        .botao:active {
            opacity: 0.55;
        }

        .especial {
            background: #a5a5a5;
            color: #000;
        }

        .operador {
            background: #ff9f0a;
            color: #fff;
        }

        .zero {
            grid-column: span 2;

            aspect-ratio: auto;

            border-radius: 50px;

            justify-content: flex-start;

            padding-left: 30px;
        }

        /* =========================
           PAINEL
        ========================= */

        #painel {
            display: none;

            width: 100%;
            min-height: 100vh;

            background: #080808;

            padding: 25px;

            overflow-y: auto;
        }

        .painel-container {
            width: 100%;
            max-width: 600px;

            margin: 0 auto;
        }

        .painel-titulo {
            margin-top: 30px;
            margin-bottom: 8px;

            color: #fff;

            font-size: 32px;
            font-weight: 700;
        }

        .painel-subtitulo {
            margin-bottom: 30px;

            color: #999;

            font-size: 16px;
        }

        .card {
            width: 100%;

            margin-bottom: 15px;
            padding: 20px;

            background: #151515;

            border: 1px solid #292929;
            border-radius: 18px;
        }

        .card h2 {
            margin: 0 0 8px;

            color: #fff;

            font-size: 20px;
            font-weight: 600;
        }

        .card p {
            margin: 0;

            color: #aaa;

            font-size: 15px;
            line-height: 1.5;
        }

        .painel-botao {
            width: 100%;
            height: 55px;

            margin-top: 15px;

            border-radius: 14px;

            background: #007aff;
            color: #fff;

            font-size: 18px;
            font-weight: 600;
        }

        .painel-botao:active {
            opacity: 0.7;
        }

        .voltar {
            margin-top: 10px;

            background: #222;
        }

        /* =========================
           COMPUTADOR
        ========================= */

        @media (min-width: 600px) {
            #calculadora {
                width: 500px;
                max-width: 100%;

                margin: 0 auto;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         CALCULADORA
    ========================= -->

    <div id="calculadora">

        <div id="display">0</div>

        <div class="botoes">

            <button
                type="button"
                class="botao especial"
                onclick="limpar()"
            >
                AC
            </button>

            <button
                type="button"
                class="botao especial"
                onclick="porcentagem()"
            >
                %
            </button>

            <button
                type="button"
                class="botao especial"
                onclick="mudarSinal()"
            >
                ±
            </button>

            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('/')"
            >
                ÷
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('7')"
            >
                7
            </button>

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('8')"
            >
                8
            </button>

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('9')"
            >
                9
            </button>

            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('*')"
            >
                ×
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('4')"
            >
                4
            </button>

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('5')"
            >
                5
            </button>

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('6')"
            >
                6
            </button>

            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('-')"
            >
                −
            </button>


            <button
                type="button"
                class="botao"
                onclick="digitarNumero('1')"
            >
                1
            </button>

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('2')"
            >
                2
            </button>

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('3')"
            >
                3
            </button>

            <button
                type="button"
                class="botao operador"
                onclick="selecionarOperador('+')"
            >
                +
            </button>


            <button
                type="button"
                class="botao zero"
                onclick="digitarNumero('0')"
            >
                0
            </button>

            <button
                type="button"
                class="botao"
                onclick="digitarNumero('.')"
            >
                .
            </button>

            <button
                type="button"
                class="botao operador"
                onclick="calcular()"
            >
                =
            </button>

        </div>
    </div>


    <!-- =========================
         PAINEL
    ========================= -->

    <div id="painel">

        <div class="painel-container">

            <div class="painel-titulo">
                Meu Primeiro Painel
            </div>

            <div class="painel-subtitulo">
                Painel remoto
            </div>


            <div class="card">

                <h2>
                    Status
                </h2>

                <p id="status">
                    Painel conectado.
                </p>

            </div>


            <div class="card">

                <h2>
                    Controle
                </h2>

                <p>
                    Essa tela pode ser alterada remotamente pelo GitHub.
                </p>


                <button
                    type="button"
                    class="painel-botao"
                    onclick="pressionar()"
                >
                    Clique aqui
                </button>


                <button
                    type="button"
                    class="painel-botao voltar"
                    onclick="voltar()"
                >
                    Voltar
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        let valorAtual = "0";

        let primeiroValor = null;

        let operadorAtual = null;

        let esperandoSegundoValor = false;

        let primeiroZero = false;


        function atualizarDisplay() {

            const display =
                document.getElementById("display");

            display.textContent = valorAtual;

        }


        function digitarNumero(numero) {

            /*
             * Dois toques seguidos no ZERO
             * abrem o painel.
             */

            if (numero === "0") {

                if (primeiroZero) {

                    abrirPainel();

                    primeiroZero = false;

                    return;
                }

                primeiroZero = true;

            } else {

                primeiroZero = false;

            }


            /*
             * Se acabou de escolher uma operação,
             * começa um novo número.
             */

            if (esperandoSegundoValor) {

                valorAtual = numero;

                esperandoSegundoValor = false;

            }

            /*
             * Evita números como 000123.
             */

            else if (valorAtual === "0") {

                if (numero === ".") {

                    valorAtual = "0.";

                } else {

                    valorAtual = numero;

                }

            }

            /*
             * Ponto decimal.
             */

            else if (
                numero === "." &&
                valorAtual.includes(".")
            ) {

                return;

            }

            /*
             * Adiciona o número.
             */

            else {

                valorAtual += numero;

            }


            atualizarDisplay();

        }


        function limpar() {

            valorAtual = "0";

            primeiroValor = null;

            operadorAtual = null;

            esperandoSegundoValor = false;

            primeiroZero = false;

            atualizarDisplay();

        }


        function porcentagem() {

            const numero =
                parseFloat(valorAtual);

            if (isNaN(numero)) {

                valorAtual = "0";

            } else {

                valorAtual =
                    String(numero / 100);

            }

            atualizarDisplay();

        }


        function mudarSinal() {

            const numero =
                parseFloat(valorAtual);

            if (
                isNaN(numero) ||
                numero === 0
            ) {

                return;

            }

            valorAtual =
                String(numero * -1);

            atualizarDisplay();

        }


        function selecionarOperador(operador) {

            const numero =
                parseFloat(valorAtual);

            if (isNaN(numero)) {

                return;

            }


            /*
             * Se já existe uma operação pendente,
             * calcula antes de continuar.
             */

            if (
                primeiroValor !== null &&
                operadorAtual !== null &&
                !esperandoSegundoValor
            ) {

                calcular();

            }


            primeiroValor =
                parseFloat(valorAtual);

            operadorAtual =
                operador;

            esperandoSegundoValor =
                true;

            primeiroZero =
                false;

        }


        function calcular() {

            if (
                primeiroValor === null ||
                operadorAtual === null
            ) {

                return;

            }


            const segundoValor =
                parseFloat(valorAtual);


            if (isNaN(segundoValor)) {

                return;

            }


            let resultado = 0;


            switch (operadorAtual) {

                case "+":

                    resultado =
                        primeiroValor +
                        segundoValor;

                    break;


                case "-":

                    resultado =
                        primeiroValor -
                        segundoValor;

                    break;


                case "*":

                    resultado =
                        primeiroValor *
                        segundoValor;

                    break;


                case "/":

                    if (segundoValor === 0) {

                        valorAtual = "Erro";

                        primeiroValor = null;

                        operadorAtual = null;

                        esperandoSegundoValor = false;

                        atualizarDisplay();

                        return;

                    }

                    resultado =
                        primeiroValor /
                        segundoValor;

                    break;


                default:

                    return;

            }


            /*
             * Evita números gigantes com muitos
             * números depois da vírgula.
             */

            if (
                !Number.isFinite(resultado)
            ) {

                valorAtual = "Erro";

            } else {

                valorAtual =
                    String(
                        Number(
                            resultado.toFixed(10)
                        )
                    );

            }


            primeiroValor = null;

            operadorAtual = null;

            esperandoSegundoValor = true;

            primeiroZero = false;

            atualizarDisplay();

        }


        /*
         * Abre o painel.
         */

        function abrirPainel() {

            const calculadora =
                document.getElementById(
                    "calculadora"
                );

            const painel =
                document.getElementById(
                    "painel"
                );


            calculadora.style.display =
                "none";

            painel.style.display =
                "block";

            document.body.style.overflow =
                "auto";

        }


        /*
         * Volta para a calculadora.
         */

        function voltar() {

            const calculadora =
                document.getElementById(
                    "calculadora"
                );

            const painel =
                document.getElementById(
                    "painel"
                );


            painel.style.display =
                "none";

            calculadora.style.display =
                "flex";

            document.body.style.overflow =
                "hidden";


            limpar();

        }


        /*
         * Botão do painel.
         */

        function pressionar() {

            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                "Botão pressionado!";

        }


        /*
         * Impede zoom por duplo toque
         * em alguns navegadores móveis.
         */

        let ultimoToque = 0;

        document.addEventListener(
            "touchend",
            function (evento) {

                const agora =
                    Date.now();

                if (
                    agora - ultimoToque <= 300
                ) {

                    evento.preventDefault();

                }

                ultimoToque = agora;

            },
            {
                passive: false
            }
        );

    </script>

</body>
</html>
